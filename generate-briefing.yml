name: Generate People & Purpose Briefing

on:
  schedule:
    # 5:00 PM Mountain Time (MDT = UTC-6) = 23:00 UTC
    # Runs every day — generates tomorrow's briefing the evening before
    - cron: '0 23 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab
    inputs:
      target_date:
        description: 'Date to generate briefing FOR (YYYY-MM-DD). Defaults to tomorrow.'
        required: false
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic requests python-dateutil

      - name: Generate briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: python scripts/generate.py

      - name: Commit and push index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          # Only commit if something changed
          git diff --cached --quiet || git commit -m "Briefing: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
